[theme]
base = "light"

# Shared colors for the application and input surfaces.
backgroundColor = "#F7F9F5"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#243B30"
primaryColor = "#356B55"
borderColor = "#D9E5DA"

# Use the existing local sans-serif font for body text and headings.
font = "Space Grotesk"
baseFontSize = 16
baseFontWeight = 400
headingFont = "Space Grotesk"
codeFont = "monospace"

# Keep native widget borders and consistent rounded corners.
baseRadius = "0.75rem"
buttonRadius = "0.5rem"
showWidgetBorder = true

[[theme.fontFaces]]
family = "Space Grotesk"
url = "app/static/SpaceGrotesk.ttf"
weight = "300 700"
style = "normal"

[server]
enableStaticServing = true
address = "127.0.0.1"
