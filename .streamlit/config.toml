[theme]
base = "light"

# Shared colors for the application and input surfaces.
backgroundColor = "#F1EAFE"
secondaryBackgroundColor = "#FFFDF3"
textColor = "#291344"
primaryColor = "#6330BA"
borderColor = "#6330BA"

# Use the shared body font; pixel titles are styled separately.
font = "Space Grotesk"
baseFontSize = 16
baseFontWeight = 400
headingFont = "Space Grotesk"
codeFont = "Space Grotesk"

# Use square corners and visible input borders.
baseRadius = "none"
buttonRadius = "none"
showWidgetBorder = true

[[theme.fontFaces]]
family = "Space Grotesk"
url = "app/static/SpaceGrotesk.ttf"
weight = "300 700"
style = "normal"

[server]
enableStaticServing = true
